<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#050506" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Layer Zero" />
    <title>Layer Zero</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; position: fixed; inset: 0; overscroll-behavior: none; }
  #root { height: 100%; width: 100%; }
  #gate {
    position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #050506; color: #f5f5f7;
    font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    transition: opacity .5s cubic-bezier(.2,.8,.2,1), transform .5s cubic-bezier(.2,.8,.2,1);
    background-image: radial-gradient(70% 50% at 50% 0%, rgba(255,106,61,.10), transparent 70%), radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.3px);
    background-size: auto, 22px 22px;
  }
  #gate.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .col { display: flex; flex-direction: column; align-items: center; padding: 24px; }
  .logo { width: 54px; height: 54px; }
  h1 { margin: 18px 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .sub { font-size: 13px; color: rgba(245,245,247,.55); min-height: 18px; }
  .sub.err { color: #ff6b5e; }
  .dots { display: flex; gap: 16px; margin: 26px 0 30px; }
  .dots.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
  .dot { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1.4px rgba(245,245,247,.75); transition: background .12s; }
  .dot.on { background: #f5f5f7; }
  .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; }
  .key {
    width: 76px; height: 76px; border-radius: 50%; border: 0; color: #f5f5f7; cursor: pointer;
    background: rgba(255,255,255,.08); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    font-family: inherit; font-size: 30px; font-weight: 300; line-height: 1; display: grid; place-items: center;
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,.18); transition: background .15s, transform .1s;
  }
  .key:active, .key.hit { background: rgba(255,255,255,.28); transform: scale(.96); }
  .key.ghost { background: transparent; box-shadow: none; font-size: 14px; font-weight: 500; }
  .key.ghost:active { background: rgba(255,255,255,.08); }
  .remember { margin-top: 28px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(245,245,247,.6); cursor: pointer; }
  .remember input { accent-color: #0a84ff; width: 15px; height: 15px; margin: 0; }
  .busy .pad, .busy .remember { opacity: .35; pointer-events: none; }
  .ring { animation: spin 1s linear infinite; transform-origin: 50% 50%; }
  @keyframes shake { 10%,90% { transform: translateX(-2px) } 20%,80% { transform: translateX(4px) } 30%,50%,70% { transform: translateX(-8px) } 40%,60% { transform: translateX(8px) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  @media (max-height: 640px) { .pad { gap: 10px 20px; } .key { width: 64px; height: 64px; font-size: 26px; } .dots { margin: 18px 0 20px; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="gate">
  <div class="col" id="col">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.2" fill="none" stroke="#f5f5f7" stroke-width="1.6" />
      <circle id="core" cx="12" cy="12" r="2.2" fill="#ff6a3d" />
    </svg>
    <h1>Layer Zero</h1>
    <div class="sub" id="sub">Code eingeben</div>
    <div class="dots" id="dots"></div>
    <div class="pad" id="pad"></div>
    <label class="remember"><input type="checkbox" id="remember" checked /> Auf diesem Gerät merken</label>
  </div>
</div>
<script>
(() => {
  // Die App liegt verschluesselt in data.bin (AES-256-GCM, Schluessel per PBKDF2 aus dem Code).
  // Aufbau: "LZ01" | Iterationen (uint32) | Salz (16) | IV (12) | Chiffretext. Der Code selbst steht nirgends.
  const LEN = 6
  const gate = document.getElementById("gate")
  const col = document.getElementById("col")
  const sub = document.getElementById("sub")
  const dotsEl = document.getElementById("dots")
  const pad = document.getElementById("pad")
  const remember = document.getElementById("remember")
  let code = ""
  let data = null
  let busy = false

  for (let i = 0; i < LEN; i++) dotsEl.appendChild(Object.assign(document.createElement("span"), { className: "dot" }))
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"]
  for (const k of keys) {
    const b = document.createElement("button")
    b.type = "button"
    b.className = "key" + (k === "" || k === "⌫" ? " ghost" : "")
    b.textContent = k === "⌫" ? "Löschen" : k
    if (k === "") b.style.visibility = "hidden"
    b.dataset.k = k
    b.addEventListener("click", () => press(k))
    pad.appendChild(b)
  }

  const b64 = (u8) => btoa(String.fromCharCode(...u8))
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
  const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, "0")).join("")
  const storeKey = () => "lz-key:" + hex(data.salt)
  const ls = {
    get: (k) => { try { return localStorage.getItem(k) } catch { return null } },
    set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
    del: (k) => { try { localStorage.removeItem(k) } catch {} },
  }

  function paint() {
    dotsEl.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("on", i < code.length))
  }
  function setBusy(on, text) {
    busy = on
    col.classList.toggle("busy", on)
    sub.classList.remove("err")
    sub.textContent = text || "Code eingeben"
  }
  function fail(text) {
    setBusy(false)
    sub.textContent = text
    sub.classList.add("err")
    dotsEl.classList.remove("shake")
    void dotsEl.offsetWidth
    dotsEl.classList.add("shake")
    code = ""
    paint()
  }

  async function loadData() {
    const r = await fetch("data.bin", { cache: "no-cache" })
    if (!r.ok) throw new Error("data.bin " + r.status)
    const u8 = new Uint8Array(await r.arrayBuffer())
    if (String.fromCharCode(...u8.slice(0, 4)) !== "LZ01") throw new Error("Format")
    const iter = new DataView(u8.buffer).getUint32(4)
    return { iter, salt: u8.slice(8, 24), iv: u8.slice(24, 36), ct: u8.slice(36) }
  }

  async function derive(pin) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"])
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: data.salt, iterations: data.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"])
  }

  async function unlock(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: data.iv }, key, data.ct)
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text()
    return JSON.parse(text)
  }

  function boot(p) {
    const st = document.createElement("style")
    st.textContent = p.css
    document.head.appendChild(st)
    window.__LZ_THUMBS = p.thumbs || {}
    window.__LZ_ICONS = p.icons || {}
    window.__LZ_LOCK = () => {
      ls.del(storeKey())
      location.reload()
    }
    const url = URL.createObjectURL(new Blob([p.js], { type: "text/javascript" }))
    const s = document.createElement("script")
    s.type = "module"
    s.src = url
    document.body.appendChild(s)
    window.setTimeout(() => {
      gate.classList.add("gone")
      window.setTimeout(() => gate.remove(), 600)
    }, 250)
  }

  async function tryPin() {
    setBusy(true, "Entsperre …")
    try {
      const key = await derive(code)
      const p = await unlock(key)
      if (remember.checked) ls.set(storeKey(), b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))))
      boot(p)
    } catch (e) {
      fail(e && e.name === "OperationError" ? "Falscher Code" : "Fehler beim Entsperren")
    }
  }

  function press(k) {
    if (busy || !data) return
    if (k === "⌫") code = code.slice(0, -1)
    else if (/^[0-9]$/.test(k) && code.length < LEN) code += k
    paint()
    if (code.length === LEN) tryPin()
  }

  window.addEventListener("keydown", (e) => {
    if (/^[0-9]$/.test(e.key)) press(e.key)
    else if (e.key === "Backspace") press("⌫")
    else return
    const b = pad.querySelector('[data-k="' + (e.key === "Backspace" ? "⌫" : e.key) + '"]')
    if (b) { b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 120) }
  })

  ;(async () => {
    if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
      return fail("Dieser Browser ist zu alt für Layer Zero")
    }
    setBusy(true, "Lade …")
    try {
      data = await loadData()
    } catch {
      return fail("Daten nicht erreichbar")
    }
    // Gemerktes Geraet: ohne Code direkt entsperren
    const saved = ls.get(storeKey())
    if (saved) {
      try {
        const key = await crypto.subtle.importKey("raw", unb64(saved), { name: "AES-GCM" }, true, ["decrypt"])
        return boot(await unlock(key))
      } catch {
        ls.del(storeKey())
      }
    }
    setBusy(false)
  })()
})()
</script>
</body>
</html>
